<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0; background: black; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            color: white; font-family: 'Courier New', Courier, monospace;
        }
        #counter-ui {
            font-size: 24px; margin-bottom: 20px; text-transform: uppercase;
        }
        #pipis {
            height: 40vh; image-rendering: pixelated; cursor: pointer;
            transition: transform 0.1s;
        }
        .spamton-head {
            position: absolute; width: 100px; image-rendering: pixelated; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="counter-ui">[Safe] Points: <span id="count-number">0</span></div>
    
    <audio id="boomSound" src="boom.mp3"></audio>
    <img id="pipis" src="pipis.png" onclick="spawnHeads()">

    <script>
        // Load the count when the page opens
        let count = localStorage.getItem('pipisCount') || 0;
        document.getElementById('count-number').innerText = count;

        function spawnHeads() {
            // Update and Save the count
            count++;
            localStorage.setItem('pipisCount', count);
            document.getElementById('count-number').innerText = count;

            const pipis = document.getElementById('pipis');
            const sound = document.getElementById('boomSound');
            const rect = pipis.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            sound.play();
            pipis.style.visibility = 'hidden'; // Hide but keep layout

            for (let i = 0; i < 35; i++) {
                const head = document.createElement('img');
                head.src = 'spamton-head.gif';
                head.className = 'spamton-head';
                head.style.left = centerX + 'px';
                head.style.top = centerY + 'px';
                document.body.appendChild(head);

                const angle = Math.random() * Math.PI * 2;
                const speed = 10 + Math.random() * 15; 
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                let posX = centerX;
                let posY = centerY;

                function moveHead() {
                    posX += vx; posY += vy;
                    head.style.left = posX + 'px';
                    head.style.top = posY + 'px';
                    if (posX > -200 && posX < window.innerWidth + 200 && posY > -200 && posY < window.innerHeight + 200) {
                        requestAnimationFrame(moveHead);
                    } else { head.remove(); }
                }
                requestAnimationFrame(moveHead);
            }

            setTimeout(() => {
                window.location.href = "https://deltarune.com/sweepstakes/";
            }, 2000);
        }
    </script>
</body>
</html>
