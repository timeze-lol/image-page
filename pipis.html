<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0; background: black; overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #pipis {
            height: 40vh; image-rendering: pixelated; cursor: pointer;
            transition: transform 0.1s;
        }
        #pipis:active { transform: scale(0.9); }
        .spamton-head {
            position: absolute; width: 100px; /* Bigger heads for more impact */
            image-rendering: pixelated; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Sound element (hidden) -->
    <audio id="boomSound" src="boom.mp3"></audio>

    <img id="pipis" src="pipis.png" onclick="spawnHeads()">

    <script>
        function spawnHeads() {
            const pipis = document.getElementById('pipis');
            const sound = document.getElementById('boomSound');
            const rect = pipis.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Play the sound immediately
            sound.play();

            pipis.style.display = 'none';

            for (let i = 0; i < 35; i++) { // More heads for a "faster" look
                const head = document.createElement('img');
                head.src = 'spamton-head.gif';
                head.className = 'spamton-head';
                head.style.left = centerX + 'px';
                head.style.top = centerY + 'px';
                document.body.appendChild(head);

                const angle = Math.random() * Math.PI * 2;
                // SPEED INCREASED HERE (was 4-12, now 10-25)
                const speed = 10 + Math.random() * 15; 
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                let posX = centerX;
                let posY = centerY;

                function moveHead() {
                    posX += vx;
                    posY += vy;
                    head.style.left = posX + 'px';
                    head.style.top = posY + 'px';
                    
                    if (posX > -200 && posX < window.innerWidth + 200 && 
                        posY > -200 && posY < window.innerHeight + 200) {
                        requestAnimationFrame(moveHead);
                    } else {
                        head.remove();
                    }
                }
                requestAnimationFrame(moveHead);
            }

            // Redirect slightly faster to match the speed
            setTimeout(() => {
                window.location.href = "https://google.com";
            }, 1800);
        }
    </script>
</body>
</html>
