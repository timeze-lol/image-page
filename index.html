<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            flex-direction: column; /* Stacks items vertically */
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        img {
            height: 60vh; /* This uses 60% of the screen height */
            width: auto;  /* Keeps his proportions correct */
            max-width: 90vw; /* Prevents him from bleeding off the sides */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin-bottom: 20px;
        }

        .big-shot-btn {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #e62020; /* Red color */
            border: 4px solid white;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
        }
        .big-shot-btn:hover {
            background-color: #ffd700; /* Turns Gold on hover */
            color: black;
        }
    </style>
</head>
<body>

    <img src="spamdance.gif">

    <!-- Change the href to whatever website you want to go to -->
    <a href="https://google.com" class="big-shot-btn">NOW'S YOUR CHANCE!</a>

</body>
</html>
